<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OAuth callback — 525 Ads</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    code { background: #f4f4f4; padding: 0.2rem 0.4rem; word-break: break-all; }
    .ok { color: #0a0; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>525 Ads — OAuth</h1>
  <p id="msg">Processing…</p>
  <pre id="out"></pre>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get('auth_code') || p.get('code');
    const err = p.get('error');
    const el = document.getElementById('msg');
    const out = document.getElementById('out');
    if (err) {
      el.className = 'err';
      el.textContent = 'Authorization failed: ' + err;
      out.textContent = p.get('error_description') || '';
    } else if (code) {
      el.className = 'ok';
      el.textContent = 'Copy auth_code and run oauth_exchange.py on your PC:';
      out.textContent = code;
    } else {
      el.textContent = 'No auth_code in URL. Complete authorization from TikTok first.';
    }
  </script>
</body>
</html>
